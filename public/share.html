<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <title>CloudVault — Shared File</title>
  <script>try{var _b=JSON.parse(document.getElementById('branding-data')?.textContent||'{}');if(_b.siteName)document.title=_b.siteName+' — Shared File'}catch{}</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#0B1018" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
  <meta name="description" content="CloudVault is an open-source private cloud storage for Cloudflare Workers + R2, with WebDAV, share links and a bilingual interface.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CloudVault">
  <meta property="og:description" content="Open-source private cloud storage for Cloudflare Workers + R2. WebDAV, share links, dark and light themes.">
  <meta property="og:image" content="https://pan.laobaitv.net/og-image.png?v=1.14.2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CloudVault">
  <meta name="twitter:description" content="Open-source private cloud storage for Cloudflare Workers + R2. WebDAV, share links, dark and light themes.">
  <meta name="twitter:image" content="https://pan.laobaitv.net/og-image.png?v=1.14.2">
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/tailwind.css">
  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.4s ease-out; }
    .preview-container { background: var(--bg-primary); border-radius: 12px; overflow: hidden; max-height: 70vh; display: flex; align-items: center; justify-content: center; }
    .preview-container img { max-width: 100%; max-height: 70vh; object-fit: contain; }
    .preview-container video, .preview-container audio { width: 100%; max-height: 70vh; }
    .preview-container iframe { width: 100%; height: 70vh; border: none; }
    .preview-container pre { width: 100%; max-height: 70vh; overflow: auto; padding: 20px; margin: 0; font-size: 13px; line-height: 1.6; color: var(--text-primary); background: var(--bg-primary); }
    .copy-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent-soft); border: 1px solid var(--accent); color: var(--text-primary); padding: 10px 20px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity 0.2s; pointer-events: none; backdrop-filter: blur(12px); }
    .copy-toast.show { opacity: 1; }
  </style>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="font-family:var(--font-body)" class="min-h-screen flex flex-col">
<div class="glow-orbs"></div>
  <script id="file-data" type="application/json">{}</script>

  <header class="border-b border-[var(--border)] px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center gap-2">
      <div id="brand-icon" class="w-7 h-7">
        <img src="/brand/cloudvault-mark.svg" alt="" class="w-full h-full object-contain">
      </div>
      <span id="brand-name" class="font-semibold text-sm text-[var(--text-primary)]">CloudVault</span>
      <button data-lang-toggle class="lang-btn ml-auto" aria-label="Switch language">EN</button>
    </div>
  </header>

  <main class="flex-1 flex items-start justify-center p-4 pt-8">
    <div class="fade-up w-full max-w-4xl">

      <div id="password-gate" class="hidden max-w-sm mx-auto">
        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-6 text-center">
          <svg class="w-12 h-12 mx-auto mb-4 text-[var(--text-muted)]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
          <h2 class="text-lg font-semibold text-[var(--text-primary)] mb-1">Password Protected</h2>
          <p class="text-sm text-[var(--text-muted)] mb-4">Enter the password to access this file</p>
          <form id="password-form" method="POST">
            <input type="password" name="password" placeholder="Password" required autofocus class="w-full px-4 py-3 rounded-md bg-[var(--bg-tertiary)] border border-[var(--border-light)] text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none focus:ring-2 focus:ring-accent-400 mb-3">
            <div id="password-error" class="hidden text-sm mb-3" style="color:var(--danger)"></div>
            <button type="submit" class="w-full py-3 rounded-md bg-transparent border border-accent-400 text-accent-400 hover:bg-accent-400/10 hover:shadow-[0_0_20px_rgba(0,229,255,0.15)] font-medium transition-all">Unlock</button>
          </form>
        </div>
      </div>

      <div id="file-view" class="hidden">
        <div id="preview-area" class="preview-container mb-6"></div>

        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-5">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-md bg-[var(--bg-tertiary)] flex items-center justify-center text-2xl flex-shrink-0" id="file-icon"></div>
            <div class="flex-1 min-w-0">
              <h1 class="text-lg font-semibold text-[var(--text-primary)] truncate" id="file-name" data-no-i18n></h1>
              <div class="flex flex-wrap items-center gap-3 mt-1 text-sm text-[var(--text-muted)]">
                <span id="file-size"></span>
                <span>&middot;</span>
                <span id="file-date"></span>
                <span>&middot;</span>
                <span id="file-downloads"></span>
              </div>
            </div>
          </div>

          <div class="flex gap-2 mt-5">
            <a id="download-btn" class="flex-1 flex items-center justify-center gap-2 py-3 rounded-md bg-transparent border border-accent-400 text-accent-400 hover:bg-accent-400/10 hover:shadow-[0_0_20px_rgba(0,229,255,0.15)] font-medium transition-all text-center cursor-pointer">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
              Download
            </a>
            <button id="copy-btn" class="copy-btn px-4 py-3" title="Copy link">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div id="folder-view" class="hidden">
        <div class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-5 mb-4">
          <div class="flex items-center gap-3 mb-4">
            <div class="w-10 h-10 rounded-md bg-[var(--bg-tertiary)] flex items-center justify-center text-xl flex-shrink-0">📁</div>
            <div class="flex-1 min-w-0">
              <h1 class="text-lg font-semibold text-[var(--text-primary)] truncate" id="folder-title"></h1>
              <div id="folder-breadcrumb" data-no-i18n class="flex items-center gap-1 mt-1 text-sm text-[var(--text-muted)] flex-wrap"></div>
            </div>
            <button id="folder-copy-btn" class="copy-btn px-3 py-2 text-sm" title="Copy link">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/></svg>
            </button>
          </div>

          <div id="folder-subfolders" class="space-y-1 mb-3"></div>

          <div id="folder-files" data-no-i18n class="space-y-1"></div>

          <div id="folder-empty" class="hidden text-center py-8">
            <p class="text-[var(--text-muted)] text-sm">This folder is empty</p>
          </div>
        </div>
      </div>

      <div id="error-view" class="hidden max-w-sm mx-auto text-center">
        <svg class="w-16 h-16 mx-auto mb-4 text-[var(--text-muted)]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
        <h2 class="text-xl font-semibold text-[var(--text-primary)] mb-2">File Not Available</h2>
        <p class="text-[var(--text-muted)]" id="error-message">This share link may have expired or been revoked.</p>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-xs text-[var(--text-muted)]">Build your own · <a href="https://github.com/zqs1qiwan/cloudvault" target="_blank" rel="noopener" class="hover:text-[var(--text-secondary)] underline">zqs1qiwan/CloudVault</a></footer>

  <div class="copy-toast" id="copy-toast">Link copied to clipboard</div>

  <script>
    (function() {
      try {
        var b = JSON.parse(document.getElementById('branding-data')?.textContent || '{}');
        if (b.siteName) document.getElementById('brand-name').textContent = b.siteName;
        if (b.siteIconUrl) {
          var iconEl = document.getElementById('brand-icon');
          iconEl.innerHTML = '<img src="' + b.siteIconUrl + '" class="w-full h-full object-contain">';
          iconEl.classList.add('overflow-hidden');
        }
      } catch {}
    })();
  </script>
  <script src="/js/share.js"></script>
</body>
</html>
