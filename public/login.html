<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <title>CloudVault — Login</title>
  <script>try{var _b=JSON.parse(document.getElementById('branding-data')?.textContent||'{}');if(_b.siteName)document.title=_b.siteName+' — Login'}catch{}</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#0B1018" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
  <meta name="description" content="CloudVault is an open-source private cloud storage for Cloudflare Workers + R2, with WebDAV, share links and a bilingual interface.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CloudVault">
  <meta property="og:description" content="Open-source private cloud storage for Cloudflare Workers + R2. WebDAV, share links, dark and light themes.">
  <meta property="og:image" content="https://pan.laobaitv.net/og-image.png?v=1.14.2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CloudVault">
  <meta name="twitter:description" content="Open-source private cloud storage for Cloudflare Workers + R2. WebDAV, share links, dark and light themes.">
  <meta name="twitter:image" content="https://pan.laobaitv.net/og-image.png?v=1.14.2">
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/tailwind.css">
  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.5s ease-out; }
    @keyframes shake { 10%,90% { transform: translateX(-1px); } 20%,80% { transform: translateX(2px); } 30%,50%,70% { transform: translateX(-3px); } 40%,60% { transform: translateX(3px); } }
    .shake { animation: shake 0.5s ease-in-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.6s linear infinite; }
  </style>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="font-family:var(--font-body)" class="min-h-screen flex items-center justify-center p-4">
<div class="glow-orbs"></div>
<div class="lang-fixed"><button data-lang-toggle class="lang-btn" aria-label="Switch language">EN</button></div>
  <div class="fade-up w-full max-w-sm">
    <div class="text-center mb-8">
      <div id="brand-icon" class="inline-flex items-center justify-center w-16 h-16 mb-4 overflow-hidden">
        <img src="/brand/cloudvault-mark.svg" alt="" class="w-full h-full object-contain">
      </div>
      <h1 id="brand-name" class="text-2xl font-bold text-[var(--text-primary)]">CloudVault</h1>
      <p class="text-[var(--text-muted)] text-sm mt-1">Personal Cloud Storage</p>
    </div>

    <form id="login-form" class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-6 shadow-2xl">
      <div id="error-box" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center"></div>

      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-[var(--text-secondary)] mb-2">Account</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Username"
          required
          autofocus
          class="w-full px-4 py-3 rounded-md bg-[var(--bg-tertiary)] border border-[var(--border-light)] text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none focus:ring-2 focus:ring-accent-400 focus:border-transparent transition-all"
        >
      </div>

      <div class="mb-5">
        <label for="password" class="block text-sm font-medium text-[var(--text-secondary)] mb-2">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
          class="w-full px-4 py-3 rounded-md bg-[var(--bg-tertiary)] border border-[var(--border-light)] text-[var(--text-primary)] placeholder-[var(--text-muted)] focus:outline-none focus:ring-2 focus:ring-accent-400 focus:border-transparent transition-all"
        >
      </div>

      <button
        type="submit"
        id="submit-btn"
        class="w-full py-3 px-4 rounded-md bg-transparent border border-accent-400 text-accent-400 hover:bg-accent-400/10 hover:shadow-[0_0_20px_rgba(0,229,255,0.15)] font-medium transition-all focus:outline-none focus:ring-2 focus:ring-accent-400 focus:ring-offset-2 focus:ring-offset-[var(--bg-primary)] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
      >
        <span id="btn-text">Sign In</span>
        <svg id="btn-spinner" class="hidden spinner w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
      </button>
    </form>

    <p class="text-center text-[var(--text-muted)] text-xs mt-5">Upgrading an older single-password vault? Sign in as <strong>root</strong> with the password you used before.</p>

    <p class="text-center text-[var(--text-muted)] text-xs mt-6">Powered by <a href="https://github.com/zqs1qiwan/cloudvault" target="_blank" rel="noopener" class="hover:text-[var(--text-secondary)] underline">zqs1qiwan/CloudVault</a></p>
  </div>

  <script>
    (function() {
      try {
        var b = JSON.parse(document.getElementById('branding-data')?.textContent || '{}');
        if (b.siteName) document.getElementById('brand-name').textContent = b.siteName;
        if (b.siteIconUrl) {
          var iconEl = document.getElementById('brand-icon');
          iconEl.innerHTML = '<img src="' + b.siteIconUrl + '" class="w-12 h-12 object-contain">';
        }
        // Note: Do NOT overwrite the "Powered by" attribution footer
      } catch {}
    })();

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = 'Signing in...';
      btnSpinner.classList.remove('hidden');

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(new FormData(form)),
          credentials: 'same-origin',
          redirect: 'follow',
        });

        if (res.redirected) {
          window.location.href = res.url;
          return;
        }

        if (res.ok) {
          window.location.href = '/admin';
          return;
        }

        const data = await res.json().catch(() => ({ error: 'Invalid username or password' }));
        if (data.setup) {
          window.location.href = '/setup';
          return;
        }
        errorBox.textContent = data.error || 'Invalid username or password';
        errorBox.classList.remove('hidden');
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 500);
      } catch {
        errorBox.textContent = 'Connection error. Please try again.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In';
        btnSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
