<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <title>404 — Page Not Found</title>
  <script>try{var _b=JSON.parse(document.getElementById('branding-data')?.textContent||'{}');if(_b.siteName)document.title='404 — '+_b.siteName}catch{}</script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="theme-color" content="#0B1018" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
  <meta name="description" content="CloudVault is an open-source private cloud storage for Cloudflare Workers + R2, with WebDAV, share links and a bilingual interface.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="CloudVault">
  <meta property="og:description" content="Open-source private cloud storage for Cloudflare Workers + R2. WebDAV, share links, dark and light themes.">
  <meta property="og:image" content="https://pan.laobaitv.net/og-image.png?v=1.14.2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CloudVault">
  <meta name="twitter:description" content="Open-source private cloud storage for Cloudflare Workers + R2. WebDAV, share links, dark and light themes.">
  <meta name="twitter:image" content="https://pan.laobaitv.net/og-image.png?v=1.14.2">
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body style="font-family:var(--font-body)" class="min-h-screen flex flex-col">
<div class="glow-orbs"></div>

  <header class="border-b border-[var(--border)] px-4 py-3">
    <div class="max-w-5xl mx-auto flex items-center gap-2">
      <a href="/" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
        <div id="brand-icon" class="w-7 h-7 overflow-hidden">
          <img src="/brand/cloudvault-mark.svg" alt="" class="w-full h-full object-contain">
        </div>
        <span id="brand-name" class="font-semibold text-sm text-[var(--text-primary)]">CloudVault</span>
      </a>
      <button data-lang-toggle class="lang-btn ml-auto" aria-label="Switch language">EN</button>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4">
    <div class="text-center">
      <p class="text-7xl font-bold text-[var(--text-secondary)] mb-2">404</p>
      <p class="text-lg font-medium text-[var(--text-secondary)] mb-1">Page not found</p>
      <p class="text-sm text-[var(--text-muted)] mb-8">The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-md bg-transparent border border-accent-400 text-accent-400 hover:bg-accent-400/10 hover:shadow-[0_0_20px_rgba(0,229,255,0.15)] text-sm font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
        Back to Home
      </a>
    </div>
  </main>

  <footer class="text-center py-4 text-xs text-[var(--text-muted)]">Powered by <a href="https://github.com/zqs1qiwan/cloudvault" target="_blank" rel="noopener" class="hover:text-[var(--text-secondary)] underline">zqs1qiwan/CloudVault</a></footer>

  <script>
    (function() {
      try {
        var b = JSON.parse(document.getElementById('branding-data')?.textContent || '{}');
        if (b.siteName) document.getElementById('brand-name').textContent = b.siteName;
        if (b.siteIconUrl) {
          var iconEl = document.getElementById('brand-icon');
          iconEl.innerHTML = '<img src="' + b.siteIconUrl + '" class="w-full h-full object-contain" onerror="this.src=\'/brand/cloudvault-mark.svg\'">';
          iconEl.classList.add('overflow-hidden');
        }
      } catch {}
    })();
  </script>
</body>
</html>
