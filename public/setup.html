<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <title>CloudVault — Setup</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp 0.5s ease-out; }
    @keyframes shake { 10%,90% { transform: translateX(-1px); } 20%,80% { transform: translateX(2px); } 30%,50%,70% { transform: translateX(-3px); } 40%,60% { transform: translateX(3px); } }
    .shake { animation: shake 0.5s ease-in-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.6s linear infinite; }
    .field { width:100%; padding:12px 16px; border-radius:6px; background:var(--bg-tertiary); border:1px solid var(--border-light); color:var(--text-primary); }
    .field:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  </style>
</head>
<body style="font-family:var(--font-body)" class="min-h-screen flex items-center justify-center p-4">
<div class="glow-orbs"></div>
  <div class="fade-up w-full max-w-sm">
    <div class="text-center mb-8">
      <div id="brand-icon" class="inline-flex items-center justify-center w-16 h-16 rounded-lg bg-transparent border border-accent-400/20 mb-4">
        <svg class="w-8 h-8 text-accent-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 12.75v3m0 0l-1.5-1.5m1.5 1.5l1.5-1.5"/>
        </svg>
      </div>
      <h1 id="brand-name" class="text-2xl font-bold text-[var(--text-primary)]">CloudVault</h1>
      <p class="text-[var(--text-muted)] text-sm mt-1">First-time setup</p>
    </div>

    <form id="setup-form" class="bg-[var(--bg-secondary)] border border-[var(--border)] rounded-lg p-6 shadow-2xl">
      <p class="text-xs mb-4" style="color:var(--text-muted)">
        Create the administrator account. This page stops working as soon as one account exists.
      </p>
      <div id="error-box" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm text-center"></div>

      <div class="mb-4">
        <label for="username" class="block text-sm font-medium text-[var(--text-secondary)] mb-2">Username</label>
        <input type="text" id="username" name="username" class="field" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin" required autofocus pattern="[A-Za-z0-9._-]{3,32}" title="3-32 characters: letters, digits, dot, dash, underscore">
      </div>

      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-[var(--text-secondary)] mb-2">Password</label>
        <input type="password" id="password" name="password" class="field" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8">
      </div>

      <div class="mb-5">
        <label for="confirm" class="block text-sm font-medium text-[var(--text-secondary)] mb-2">Confirm password</label>
        <input type="password" id="confirm" name="confirm" class="field" autocomplete="new-password" placeholder="Repeat the password" required minlength="8">
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3 px-4 rounded-md bg-transparent border border-accent-400 text-accent-400 hover:bg-accent-400/10 font-medium transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <span id="btn-text">Create account</span>
        <svg id="btn-spinner" class="hidden spinner w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
      </button>
    </form>

    <p class="text-center text-[var(--text-muted)] text-xs mt-6">Already set up? <a href="/login" class="hover:text-[var(--text-secondary)] underline">Sign in</a></p>
  </div>

  <script>
    (function() {
      try {
        var b = JSON.parse(document.getElementById('branding-data')?.textContent || '{}');
        if (b.siteName) { document.getElementById('brand-name').textContent = b.siteName; document.title = b.siteName + ' — Setup'; }
        if (b.siteIconUrl) {
          document.getElementById('brand-icon').innerHTML = '<img src="' + b.siteIconUrl + '" class="w-12 h-12 object-contain">';
        }
      } catch {}
    })();

    var form = document.getElementById('setup-form');
    var errorBox = document.getElementById('error-box');
    var submitBtn = document.getElementById('submit-btn');
    var btnText = document.getElementById('btn-text');
    var btnSpinner = document.getElementById('btn-spinner');

    function fail(message) {
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
      form.classList.add('shake');
      setTimeout(function() { form.classList.remove('shake'); }, 500);
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorBox.classList.add('hidden');

      var password = document.getElementById('password').value;
      if (password !== document.getElementById('confirm').value) {
        fail('Passwords do not match');
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = 'Creating...';
      btnSpinner.classList.remove('hidden');

      try {
        var res = await fetch('/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams(new FormData(form)),
          credentials: 'same-origin',
        });

        if (res.ok) { window.location.href = '/admin'; return; }

        var data = await res.json().catch(function() { return {}; });
        if (data.login) { window.location.href = '/login'; return; }
        fail(data.error || 'Setup failed');
      } catch {
        fail('Connection error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Create account';
        btnSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
